[package]
name = "fuzzy-file-finder"
version = "0.13.0"
edition = "2024"
description = "Interactive terminal file finder with fuzzy filtering, directory navigation and Neovim editing"
readme = "README.md"
repository = "https://github.com/Frankwii/fff"
license = "GPL-3.0-only"
keywords = ["cli", "terminal", "fuzzy", "file", "tui"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "fff"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
color-print = "0.3"
crossterm = "0.29.0"
globset = "0.4.21"
libc = "0.2.191"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rmpv = "1.3.1"
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
toml_edit = "0.25.17"
unicode-width = "0.2.3"
