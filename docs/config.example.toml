# Copy to ~/.config/picker/config.toml (or use --config PATH).
# Check without opening the TUI: picker --config PATH --check-config

[ui]
# See PALETTES.md: catppuccin-*, nord, gruvbox-*, tokyonight-*, plus originals.
palette = "midnight"

[palettes.ember]
# Custom palettes inherit a built-in; unspecified roles keep its values.
extends = "midnight"
accent = "#f0a76c"
marked = "#e8c979"
current_directory = "#623a28"
current_directory_text = "#fff3df"
# All color roles accept "#RRGGBB" or "default" for the terminal's own color.
# Other roles: background, panel, text, muted, border, success, error, selection.

[[bookmarks]]
name = "Home"
path = "~"

[[bookmarks]]
name = "Notes"
path = "~/notes"

[[bookmarks]]
name = "Project notes"
# Relative to this config file's directory, not the invocation directory.
path = "../../notes"

[cache]
enabled = true
max_entries = 16       # LRU snapshots of completed discovery scopes; 1..128.
max_candidates = 4096 # Maximum paths stored per snapshot; 1..100000.
ttl_seconds = 60      # Snapshot stale age; retained for provisional replay until LRU eviction.

# Opt-in experiment; requires nvim on PATH. See EDITING.md.
[editor]
backend = "basic" # Change to "nvim" for genuine modal text editing.

# Plain keys for list views (results, bookmarks, marks) in Neovim Normal mode.
# A string or list of sequences; "none" disables. See CONFIGURATION.md.
[keys.normal]
left = "h"    # Same as Alt+h in the view.
down = "j"    # Same as Alt+j.
up = "k"      # Same as Alt+k.
right = "l"   # Same as Alt+l.
first = "gg"  # First row; a lone g waits, other continuations reach Neovim.
last = "G"    # Last row.
