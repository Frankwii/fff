# Copy to $XDG_CONFIG_HOME/fff/config.toml (~/.config/fff/config.toml when
# XDG_CONFIG_HOME is unset), or pass --config PATH.
# Check without opening the TUI: fff setup --config PATH --check-config

[ui]
# See PALETTES.md for built-in names and color sources.
# At runtime, Alt+p previews/applies a palette for the session (this file is
# never rewritten) and Alt+P re-reads the palette chosen here.
palette = "midnight"
# Nerd Font filetype icons on result/marked rows; false (or --no-icons) shows ▸/·.
icons = true
# Seconds before red status messages clear by themselves; 0 keeps them.
message_seconds = 4
# Details on the right of each result row, any of "permissions", "size"
# (directories: entry count) and "modified" (time since); [] shows none.
columns = ["size", "modified"]
# The order results start in: "program" (each program's own: the best match
# minus a penalty for depth, as "log"; the best match first in fff seek), or
# "name", "size", "modified", "accessed", "created", "extension", "kind",
# "depth", "shallowest" or "log" (gs chooses for the session).
sort = "program"
# With a criterion, false reverses its own order (names from Z, the smallest,
# the oldest, the deepest or the worst match first).
sort_descending = true
# What depth costs a match in the programs' ranking and with "log", 0..1000.
temperature = 1.0
# Clicks, drags and the wheel act on the results; false leaves the mouse to
# the terminal (text selection).
mouse = true
# A button bar for mouse-only use: "off", "mouse" (shown while the mouse is
# used) or "always". Needs mouse = true.
buttons = "off"
# With buttons = "mouse", seconds a resting mouse keeps the bar; 0 keeps it.
buttons_seconds = 5
# Follow files created, removed or changed in the listed folders.
watch = true
# Start with the preview pane shown (Alt+v or P toggles it).
preview = true
# Color the syntax of text files in the preview pane, through Neovim.
highlight = true

[palettes.ember]
# Custom palettes inherit a built-in; unspecified roles keep its values.
extends = "midnight"
accent = "#f0a76c"
marked = "#e8c979"
current_directory = "#623a28"
current_directory_text = "#fff3df"
# All color roles accept "#RRGGBB" or "default" for the terminal's own color.
# Other roles: background, panel, text, muted, border, success, error, selection,
# link (symlink names), executable (default: success), empty (default: error)
# and function (function names on the Keys screen; default: error).

[[workspaces]]
name = "Home"
path = "~"

[[workspaces]]
name = "Notes"
icon = "󰠮"   # Optional: 1-2 columns, e.g. a Nerd Font glyph; default is a folder.
path = "~/notes"

[[workspaces]]
name = "Project notes"
# Relative to this config file's directory, not the invocation directory.
path = "../../notes"

# A workspace can keep more than a folder; what it leaves out stays as it is.
# Opening this one is like `fff pick --depth 10 --glob '*.pdf' ~/phd ~/books`.
[[workspaces]]
name = "Papers"
program = "pick"          # "roam", "pick" or "seek"
roots = ["~/phd", "~/books"]
depth = 10
filters = ["*.pdf", "*.djvu"]
# Also: query, contents, exclusions, sort and sort_descending, hidden,
# kinds ("all", "files" or "directories"), preview, exclusions_on, filters_on.

# In-memory snapshots; recent exhaustive views skip redundant scans.
# See "Discovery cache and performance" in CONFIGURATION.md.
[cache]
enabled = true
max_entries = 16      # Views remembered (directory + roots + depth + policies); 1..128.
max_candidates = 4096 # Paths kept per view; bigger directories replay partially; 1..100000.
ttl_seconds = 60      # Stale age and recursive-view refresh interval; 1..86400.
fresh_seconds = 3     # Skip recent complete-view rescans; depth-1 refresh interval; 0..60.
prefetch = true       # Pre-read a highlighted child after 500 ms, depth 1 only.

[performance]
refresh_ms = 50 # Min ms between re-sorts while a scan streams in; 0 = every batch.
cached_queries = 5 # Shorter queries' results kept for Backspace; 0..64, 0 = none.
max_paths = 1000000 # Paths a view may hold; a scan stops past it; 1000..100000000.

# Exclusion rules every session starts with, before those of --exclude;
# Alt+e edits them for the session, Alt+H turns them off. A rule starting
# with / or ~/ excludes that place; others match basenames or paths below
# the searched roots. See CONFIGURATION.md.
[exclusions]
rules = [] # For example ["~/backup", "node_modules"].

# x moves entries to $XDG_DATA_HOME/fff/trash (or a .fff-trash-UID folder at
# the top of another filesystem); u brings them back. See CONFIGURATION.md.
[trash]
enabled = true       # false: x deletes permanently, after a review.
days = 30            # Deleted from the trash at startup after this; 1..36500.
ask_above = "10 GiB" # Larger entries ask: delete permanently or trash anyway.

# Every text field is a clean embedded Neovim; nvim must be on PATH.
# Openers: l / Alt+l / Alt+number open a file in the background, o in this
# terminal. First match wins; unmatched files use $EDITOR. See CONFIGURATION.md.
[open]
# Unset, both use the terminal fff runs in (see CONFIGURATION.md).
# terminal = "st -e"   # runs terminal openers in a new window
# fff_terminal = "st -c fff-picker -e"   # fff's own window from fff setup

[[open.rules]]
command = "zathura"
extensions = ["pdf", "djvu", "epub"]
# From a contents match: the match's page, the query searched and highlighted.
# Placeholders: {page} {line} {percent} {query} {match} {nth} {count} {path};
# see CONFIGURATION.md, "Opening at a contents match".
at_grep_match = "--page {page} --find {query}"

[[open.rules]]
command = "nvim"
patterns = ["Makefile"]
terminal = true

# Keys live in keys.toml beside this file; F1 edits it. See keys.example.toml.
