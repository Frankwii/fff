# Copy to $XDG_CONFIG_HOME/fff/config.toml (~/.config/fff/config.toml when
# XDG_CONFIG_HOME is unset), or pass --config PATH.
# Check without opening the TUI: fff --config PATH --check-config

[ui]
# See PALETTES.md for built-in names and color sources.
# At runtime, Alt+p previews/applies a palette for the session (this file is
# never rewritten) and Alt+P re-reads the palette chosen here.
palette = "midnight"
# Nerd Font filetype icons on result/marked rows; false (or --no-icons) shows ▸/·.
icons = true
# Seconds before red status messages clear by themselves; 0 keeps them.
message_seconds = 4
# Start where the last session ended (default mode without ROOTS); --here overrides.
resume = true

[palettes.ember]
# Custom palettes inherit a built-in; unspecified roles keep its values.
extends = "midnight"
accent = "#f0a76c"
marked = "#e8c979"
current_directory = "#623a28"
current_directory_text = "#fff3df"
# All color roles accept "#RRGGBB" or "default" for the terminal's own color.
# Other roles: background, panel, text, muted, border, success, error, selection,
# link (symlink names), executable (default: success) and empty (default: error).

[[bookmarks]]
name = "Home"
path = "~"

[[bookmarks]]
name = "Notes"
icon = "󰠮"   # Optional: 1-2 columns, e.g. a Nerd Font glyph; default is a folder.
path = "~/notes"

[[bookmarks]]
name = "Project notes"
# Relative to this config file's directory, not the invocation directory.
path = "../../notes"

# In-memory snapshots; recent exhaustive views skip redundant scans.
# See "Discovery cache and performance" in CONFIGURATION.md.
[cache]
enabled = true
max_entries = 16      # Views remembered (directory + roots + depth + policies); 1..128.
max_candidates = 4096 # Paths kept per view; bigger directories replay partially; 1..100000.
ttl_seconds = 60      # Stale age and recursive-view refresh interval; 1..86400.
fresh_seconds = 3     # Skip recent complete-view rescans; depth-1 refresh interval; 0..60.
prefetch = true       # Pre-read a highlighted child after 500 ms, depth 1 only.

[performance]
refresh_ms = 50 # Min ms between re-sorts while a scan streams in; 0 = every batch.

# Every text field is a clean embedded Neovim; nvim must be on PATH.
# Openers: l / Alt+l / Alt+number open a file in the background, o in this
# terminal. First match wins; unmatched files use $EDITOR. See CONFIGURATION.md.
[open]
terminal = "st -e"   # runs terminal openers in a new window

[[open.rules]]
command = "zathura"
extensions = ["pdf", "djvu", "epub"]

[[open.rules]]
command = "nvim"
patterns = ["Makefile"]
terminal = true

[editor]
# backend = "nvim"

# Normal-mode list actions. Buffer editors use Neovim writes and closes.
# A string or list of sequences; "none" disables. See CONFIGURATION.md.
[keys.normal]
left = "h"    # Same as Alt+h in the view.
down = "j"    # Same as Alt+j.
up = "k"      # Same as Alt+k.
right = "l"   # Same as Alt+l.
first = "gg"  # First row; a lone g waits, other continuations reach Neovim.
last = "G"    # Last row.
mark = "<space>" # Toggle marks in Normal mode, like Tab.
quit = "q"       # Exit and return the launch directory.
quit_current = "!" # Exit and return the current browsing directory.
run = "gx"       # Run a program on the current/marked paths, then come back.
run_exit = "gX"  # Run a program on the current/marked paths in place of fff.
move = "v"       # File operations: move, copy, link (each with a review),
copy = "p"
link = "s"
delete = "x"     # delete (with a review), batch rename, extract archives,
rename = "r"
extract = "e"
edit = "E"       # open in $EDITOR, and create a file or directory.
new = "n"
shallower = "<left>" # Results only: same as Alt+Left / Alt+Right (depth),
deeper = "<right>"
bookmarks = "b"  # Alt+b (bookmark chooser),
hidden = "."     # Alt+. (hidden entries),
go_to = "/"      # Alt+g (go-to prompt),
next_tab = "<up>"   # and Alt+Up / Alt+Down (next / previous tab).
prev_tab = "<down>"
depth_digits = true # Results only: 1-9 set the search depth.

# Remap any chord to a default chord, like --map-key (which wins on conflict).
# "none" disables a chord. See CONFIGURATION.md.
# [keys.map]
# "ctrl+n" = "down"
# "ctrl+g" = "alt+g"
# "alt+g" = "none"
