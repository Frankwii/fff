# The recordings' tmux: no status line, no visible borders, keys passed at
# once (Escape too), and true color through to the recording terminal.
set -g status off
set -g escape-time 0
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,st*:RGB"
set -g pane-border-style "fg=#1e1e2e,bg=#1e1e2e"
set -g pane-active-border-style "fg=#1e1e2e,bg=#1e1e2e"
set -g pane-border-lines simple
set -g window-style "bg=#1e1e2e"
set -g focus-events off
