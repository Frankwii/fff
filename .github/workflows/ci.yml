# The verification of docs/DEVELOPMENT.md on Linux and macOS, after every
# push to main and on pull requests. The stress tests are heavy: run them by
# hand from the Actions tab (or `gh workflow run ci.yml -f stress=true`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: Run the stress tests too
        type: boolean
        default: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's Neovim is too old; fff embeds one in every text field. The
      # release is kept between runs, so GitHub's downloads failing for a
      # while (504s) does not fail the run.
      - name: Neovim release, kept between runs
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/nvim-linux-x86_64.tar.gz
          key: nvim-v0.12.6-linux-x86_64
      - name: libarchive and Neovim
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev
          if [ ! -s ~/nvim-linux-x86_64.tar.gz ]; then
            curl -fsSL --retry 10 --retry-all-errors --retry-max-time 600 -o ~/nvim-linux-x86_64.tar.gz \
              https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz
          fi
          sudo tar -xzf ~/nvim-linux-x86_64.tar.gz -C /opt
          echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
          # The mount tests make bind mounts in a user namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Neovim
        if: runner.os == 'macOS'
        run: brew install neovim
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tests/terminal_smoke.py
      - name: Stress tests
        if: inputs.stress
        run: cargo test --locked --lib stress -- --ignored
